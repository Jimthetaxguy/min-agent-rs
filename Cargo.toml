[package]
name = "min-agent"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A small, read-only, protocol-oriented Rust coding agent"
license = "MIT"
repository = "https://github.com/Jimthetaxguy/min-agent-rs"

[dependencies]
anyhow = "1"
cap-std = "3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
