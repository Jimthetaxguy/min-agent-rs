[package]
name = "min-agent"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A small, read-only, protocol-oriented Rust coding agent"
license = "MIT"
repository = "https://github.com/Jimthetaxguy/min-agent-rs"

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
cap-std = "3"
# Blocking HTTP/1 client. rustls is ring + webpki roots; gzip, brotli, charset,
# cookies, and native-tls stay off. No tokio or hyper. aws-lc-rs was measured
# larger than ring (2,972,136 vs 2,192,360 bytes) and is not used.
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Config is parsed only; the TOML display/serializer feature is unused.
toml = { version = "0.8", default-features = false, features = ["parse"] }
url = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

# Release size budget: scripts/check-release-size.sh.
# opt-level "z" measured smaller than "s" on x86_64-unknown-linux-gnu.
# panic = abort is safe here: ureq does not use tokio, and nothing in the
# linked graph catch_unwinds as control flow. once_cell (rustls, rustix)
# only catches panics to poison lazy init, which abort turns into process exit.
# Nightly flags were measured and are not enabled, so stable rustc still builds:
# -Zlocation-detail=none was 2,127,760 bytes; panic = "immediate-abort" with
# -Zbuild-std was 1,934,264. Neither is part of this profile.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
