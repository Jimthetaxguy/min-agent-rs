# Explicit user-supplied configuration; replace model IDs before real use.
# No credential values belong in this file.
[connections.openrouter]
protocol = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
auth = { kind = "bearer_env", env = "OPENROUTER_API_KEY" }

[connections.litellm]
protocol = "openai_chat"
base_url = "http://127.0.0.1:4000"
auth = { kind = "bearer_env", env = "LITELLM_API_KEY" }

[connections.local]
protocol = "openai_chat"
base_url = "http://127.0.0.1:11434/v1"
auth = { kind = "none" }

[models.openrouter]
connection = "openrouter"
model = "<tool-capable-model-id>"
native_tools = true

[models.litellm]
connection = "litellm"
model = "<configured-proxy-model-alias>"
native_tools = true

[models.local]
connection = "local"
model = "<installed-local-model-id>"
native_tools = true

# Native OpenAI Responses (stateless: store=false, encrypted reasoning replayed).
[connections.openai]
protocol = "openai_responses"
base_url = "https://api.openai.com/v1"
auth = { kind = "bearer_env", env = "OPENAI_API_KEY" }

# Native Anthropic Messages; the header name is explicit, not inferred.
[connections.anthropic]
protocol = "anthropic_messages"
base_url = "https://api.anthropic.com/v1"
auth = { kind = "header_env", header = "x-api-key", env = "ANTHROPIC_API_KEY" }

# A connection may name an explicit proxy; ambient HTTP(S)_PROXY is never used.
# [connections.corp]
# protocol = "openai_chat"
# base_url = "https://gateway.example.com/v1"
# auth = { kind = "bearer_env", env = "GATEWAY_API_KEY" }
# proxy = "http://proxy.example.com:3128"

[models.openai]
connection = "openai"
model = "<responses-model-id>"
native_tools = true
max_output_tokens = 4096

[models.anthropic]
connection = "anthropic"
model = "<messages-model-id>"
native_tools = true
max_output_tokens = 4096
